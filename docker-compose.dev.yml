services:
  # Frontend Development Service
  frontend-dev:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
      - NEXT_PUBLIC_DEBUG=true
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend-dev
    networks:
      - lics-dev-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend Development Service
  backend-dev:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "8001:8001"  # WebSocket port
      - "5678:5678"  # Debugger port
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://lics:lics123@postgres-dev:5432/lics_dev
      - REDIS_URL=redis://redis-dev:6379/0
      - CELERY_BROKER_URL=redis://redis-dev:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-dev:6379/1
      - MQTT_BROKER_URL=mqtt-dev
      - MQTT_BROKER_PORT=1883
      - MINIO_ENDPOINT=minio-dev:9000
      - MINIO_ACCESS_KEY=lics-dev-admin
      - MINIO_SECRET_KEY=lics-dev-minio-password-2024
    volumes:
      - ./services/backend:/app
      - ./infrastructure/database:/infrastructure/database
      - ./tools:/tools:ro
      - ./logs/backend-dev:/app/logs
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - lics-dev-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker Development
  celery-worker-dev:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    command: celery -A app.tasks.celery_app worker --loglevel=debug -P solo --pool=solo
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://lics:lics123@postgres-dev:5432/lics_dev
      - REDIS_URL=redis://redis-dev:6379/0
      - CELERY_BROKER_URL=redis://redis-dev:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-dev:6379/1
    volumes:
      - ./services/backend:/app
      - ./infrastructure/database:/infrastructure/database
      - ./tools:/tools:ro
      - ./logs/celery-dev:/app/logs
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Flower Development Monitoring
  flower-dev:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    command: celery -A app.tasks.celery_app flower --port=5555 --basic_auth=admin:admin123
    ports:
      - "5555:5555"  # Flower UI
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - CELERY_BROKER_URL=redis://redis-dev:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-dev:6379/1
    volumes:
      - ./services/backend:/app
      - ./logs/flower-dev:/app/logs
    depends_on:
      - redis-dev
      - celery-worker-dev
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Edge Agent Development (simulated) - COMMENTED OUT - Not implemented yet (Phase 4)
  # edge-agent-dev:
  #   build:
  #     context: ./services/edge-agent
  #     dockerfile: Dockerfile.dev
  #   environment:
  #     - ENVIRONMENT=development
  #     - DEBUG=true
  #     - MQTT_BROKER_URL=mqtt-dev
  #     - MQTT_BROKER_PORT=1883
  #     - DEVICE_ID=dev-edge-001
  #     - SIMULATE_HARDWARE=true
  #   volumes:
  #     - ./services/edge-agent:/app
  #     - ./logs/edge-agent-dev:/app/logs
  #     - ./data/edge-agent-dev:/app/data
  #   depends_on:
  #     - mqtt-dev
  #   networks:
  #     - lics-dev-network
  #   restart: unless-stopped
  #   stdin_open: true
  #   tty: true

  # ===== KONG API GATEWAY =====

  # Kong Database (PostgreSQL)
  kong-database-dev:
    image: postgres:15-alpine
    ports:
      - "5434:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_DB=kong
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kong123
    volumes:
      - kong_postgres_data:/var/lib/postgresql/data
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Kong Database Migration (runs once to initialize)
  kong-migration-dev:
    image: kong:latest
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database-dev
      - KONG_PG_PORT=5432
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong123
      - KONG_PG_DATABASE=kong
    depends_on:
      kong-database-dev:
        condition: service_healthy
    networks:
      - lics-dev-network
    restart: on-failure

  # Kong API Gateway
  kong-dev:
    image: kong:latest
    ports:
      - "8080:8000"   # Kong Proxy (HTTP)
      - "8443:8443"   # Kong Proxy (HTTPS)
      - "8002:8001"   # Kong Admin API
      - "8445:8444"   # Kong Admin API (HTTPS)
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong-dev.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_LOG_LEVEL=debug
    volumes:
      - ./infrastructure/kong/config:/kong/declarative:ro
      - ./infrastructure/kong/plugins:/kong/plugins:ro
      - ./logs/kong-dev:/kong/logs
    depends_on:
      backend-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Kong Configuration Setup (runs once to configure services via Admin API)
  kong-setup-dev:
    image: curlimages/curl:latest
    depends_on:
      kong-dev:
        condition: service_healthy
    volumes:
      - ./infrastructure/kong/scripts:/scripts:ro
    networks:
      - lics-dev-network
    entrypoint: /bin/sh
    command: -c "sleep 10 && /scripts/init-kong.sh && echo 'Kong configuration completed'"
    restart: "no"

  # PostgreSQL Development Database
  postgres-dev:
    image: timescale/timescaledb-ha:pg15-latest
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_DB=lics_dev
      - POSTGRES_USER=lics
      - POSTGRES_PASSWORD=lics123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_dev_data:/home/postgres/pgdata/data
      - ./infrastructure/database/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/database/postgresql-dev.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lics -d lics_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer Development Connection Pooler
  pgbouncer-dev:
    image: pgbouncer/pgbouncer:latest
    ports:
      - "6433:6432"  # Different port to avoid conflicts
    environment:
      - DATABASES_HOST=postgres-dev
      - DATABASES_PORT=5432
      - DATABASES_USER=lics
      - DATABASES_PASSWORD=lics123
      - DATABASES_DBNAME=lics_dev
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=50
      - DEFAULT_POOL_SIZE=10
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer-dev.ini:/etc/pgbouncer/pgbouncer.ini
      - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    networks:
      - lics-dev-network
    restart: unless-stopped
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6432"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis Development Cache
  redis-dev:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
      - ./infrastructure/redis:/scripts:ro
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Streams Setup Service
  redis-setup:
    image: python:3.11-alpine
    depends_on:
      redis-dev:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis-dev:6379/0
    volumes:
      - ./infrastructure/redis:/scripts:ro
    networks:
      - lics-dev-network
    working_dir: /scripts
    entrypoint: /bin/sh
    command: -c "pip install redis && python streams-setup.py --action setup && python pubsub-config.py --action setup && echo 'Redis setup completed'"
    restart: "no"

  # MQTT Development Broker
  mqtt-dev:
    image: eclipse-mosquitto:2.0
    ports:
      - "1884:1883"  # Different port to avoid conflicts
      - "9003:9001"  # WebSocket port
    volumes:
      - ./infrastructure/mqtt/mosquitto-minimal.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_dev_data:/mosquitto/data
      - mqtt_dev_logs:/mosquitto/log
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "lics/system/healthcheck", "-m", "ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MQTT Setup Service (creates auth files)
  mqtt-setup:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infrastructure/mqtt:/scripts:ro
      - ./infrastructure/mqtt:/output
    networks:
      - lics-dev-network
    entrypoint: /bin/sh
    command: -c "cd /scripts && ./setup-mqtt-auth.sh setup && echo 'MQTT authentication setup completed'"
    restart: "no"

  # MinIO Development Storage
  minio-dev:
    image: minio/minio:latest
    ports:
      - "9010:9000"  # Different port to avoid conflicts
      - "9011:9001"
    environment:
      - MINIO_ROOT_USER=lics-dev-admin
      - MINIO_ROOT_PASSWORD=lics-dev-minio-password-2024
      - MINIO_ENDPOINT=http://localhost:9010
    command: server /data --console-address ":9001"
    volumes:
      - minio_dev_data:/data
      - ./infrastructure/minio:/scripts:ro
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MinIO Setup Service (runs once to initialize buckets)
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio-dev:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=http://minio-dev:9000
      - MINIO_ACCESS_KEY=lics-dev-admin
      - MINIO_SECRET_KEY=lics-dev-minio-password-2024
    volumes:
      - ./infrastructure/minio:/scripts:ro
    networks:
      - lics-dev-network
    entrypoint: /bin/sh
    command: -c "sleep 10 && /scripts/bucket-init.sh init && echo 'MinIO setup completed'"
    restart: "no"

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - lics-dev-network
    restart: unless-stopped

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis-dev:6379
    depends_on:
      - redis-dev
    networks:
      - lics-dev-network
    restart: unless-stopped

  # InfluxDB Development Time Series Database
  influxdb-dev:
    image: influxdb:2.7-alpine
    ports:
      - "8087:8086"  # Different port to avoid conflicts
    volumes:
      - influxdb_dev_data:/var/lib/influxdb2
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # InfluxDB Setup Service (runs once to initialize)
  influxdb-setup:
    image: influxdb:2.7-alpine
    depends_on:
      influxdb-dev:
        condition: service_healthy
    environment:
      - INFLUXDB_INIT_USERNAME=admin
      - INFLUXDB_INIT_PASSWORD=devInflux123
      - INFLUXDB_INIT_ORG=lics-dev
      - INFLUXDB_INIT_BUCKET=telemetry-dev
      - INFLUXDB_INIT_RETENTION=7d
      - INFLUXDB_INIT_ADMIN_TOKEN=lics-dev-admin-token
      - INFLUX_HOST=http://influxdb-dev:8086
    volumes:
      - ./infrastructure/influxdb:/scripts:ro
    networks:
      - lics-dev-network
    entrypoint: /bin/sh
    command: -c "/scripts/init-dev.sh && echo 'InfluxDB setup completed'"
    restart: "no"

  # PgAdmin (PostgreSQL GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@lics.dev
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      - postgres-dev
    networks:
      - lics-dev-network
    restart: unless-stopped

  # Jaeger v2 Distributed Tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC (v2 native)
      - "4318:4318"    # OTLP HTTP (v2 native)
      - "14268:14268"  # HTTP collector (legacy compatibility)
      - "14250:14250"  # gRPC collector (legacy compatibility)
      - "6831:6831/udp"  # Jaeger thrift compact (legacy)
      - "6832:6832/udp"  # Jaeger thrift binary (legacy)
      - "9411:9411"    # Zipkin compatibility
      - "13133:13133"  # Health check endpoint
    volumes:
      - ./infrastructure/monitoring/jaeger/jaeger-v2-dev-config.yml:/etc/jaeger/config.yml:ro
    command: ["--config", "/etc/jaeger/config.yml"]
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "13133"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development Documentation Server
  docs-dev:
    image: nginx:alpine
    ports:
      - "8090:80"  # Documentation server
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./infrastructure/nginx/docs.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lics-dev-network
    restart: unless-stopped

  # Prometheus - Metrics Collection (Development)
  prometheus-dev:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Grafana - Visualization Dashboards (Development)
  grafana-dev:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources/datasources-dev.yml:/etc/grafana/provisioning/datasources/datasources-dev.yml:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - lics-dev-network
    restart: unless-stopped
    depends_on:
      prometheus-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Loki - Log Aggregation (Development)
  loki-dev:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infrastructure/monitoring/loki/loki-dev.yml:/etc/loki/loki.yml:ro
      - loki_dev_data:/loki
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Promtail - Log Collection Agent (Development)
  promtail-dev:
    image: grafana/promtail:latest
    volumes:
      - ./infrastructure/monitoring/loki/promtail-dev.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/host/logs:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - lics-dev-network
    restart: unless-stopped
    depends_on:
      loki-dev:
        condition: service_healthy

  # Alertmanager - Alert Handling (Development)
  alertmanager-dev:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager-dev.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_dev_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - lics-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Exporter (Development)
  postgres-exporter-dev:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://lics:lics123@postgres-dev:5432/lics_dev?sslmode=disable
    networks:
      - lics-dev-network
    restart: unless-stopped
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis Exporter (Development)
  redis-exporter-dev:
    image: oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis-dev:6379
      - REDIS_EXPORTER_LOG_FORMAT=json
    networks:
      - lics-dev-network
    restart: unless-stopped
    depends_on:
      redis-dev:
        condition: service_healthy
    # Note: No healthcheck - distroless container has no shell/tools for health checks
    # Service exposes metrics at :9121/metrics and is monitored by Prometheus

networks:
  lics-dev-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  mqtt_dev_data:
    driver: local
  mqtt_dev_logs:
    driver: local
  minio_dev_data:
    driver: local
  influxdb_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local
  loki_dev_data:
    driver: local
  alertmanager_dev_data:
    driver: local
  kong_postgres_data:
    driver: local