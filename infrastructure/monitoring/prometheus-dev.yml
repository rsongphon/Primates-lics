# LICS Prometheus Development Configuration
# Monitoring configuration for LICS development services

global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    environment: 'lics-development'
    cluster: 'lics-dev'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager-dev:9093

# Rule files (optional for development)
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # LICS Backend API (when running)
  - job_name: 'lics-backend-dev'
    static_configs:
      - targets: ['backend-dev:8000']
    scrape_interval: 15s
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # LICS Frontend (when running)
  - job_name: 'lics-frontend-dev'
    static_configs:
      - targets: ['frontend-dev:3000']
    scrape_interval: 30s
    metrics_path: /api/metrics
    scheme: http
    scrape_timeout: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres-dev'
    static_configs:
      - targets: ['postgres-exporter-dev:9187']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Redis Exporter
  - job_name: 'redis-dev'
    static_configs:
      - targets: ['redis-exporter-dev:9121']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Celery Worker (when running)
  - job_name: 'celery-worker-dev'
    static_configs:
      - targets: ['celery-worker-dev:9540']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Jaeger v2 (self-monitoring)
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

# Storage configuration is handled by command line parameters
