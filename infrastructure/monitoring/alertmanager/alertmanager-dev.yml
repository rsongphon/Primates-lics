# Alertmanager Development Configuration
# Simplified alert routing for LICS development environment

global:
  # Resolve timeout
  resolve_timeout: 5m

# The root route on which each incoming alert enters.
route:
  # The labels by which incoming alerts are grouped together.
  group_by: ['alertname', 'cluster', 'service']

  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  group_wait: 10s

  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 10s

  # If an alert has successfully been sent, wait 'repeat_interval' to
  # resend them.
  repeat_interval: 1h

  # Default receiver (console logging)
  receiver: dev-console

  # Development-specific routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: dev-console
      group_wait: 5s
      repeat_interval: 5m

    # Warning alerts - regular notification
    - match:
        severity: warning
      receiver: dev-console
      group_wait: 30s
      repeat_interval: 30m

# Inhibition rules allow to mute a set of alerts given that another alert is firing.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    # Apply inhibition if the alertname is the same.
    equal: ['alertname', 'cluster', 'service']

receivers:
  # Default console receiver for development
  - name: 'dev-console'
    # Alerts will be visible in Alertmanager UI
    # No email/slack notifications in dev environment

# Time intervals for muting (optional in dev)
time_intervals: []
