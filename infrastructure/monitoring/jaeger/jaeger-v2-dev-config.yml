# Jaeger v2 Development Configuration
# Based on OpenTelemetry Collector Configuration Format
# Documentation: https://www.jaegertracing.io/docs/next-release-v2/

service:
  # Extensions provide capabilities like health checks and pprof
  extensions:
    - healthcheckv2
    - jaeger_storage
    - jaeger_query

  # Pipelines define how telemetry data flows through the system
  pipelines:
    traces:
      receivers:
        - otlp        # OpenTelemetry Protocol (preferred for v2)
        - jaeger      # Legacy Jaeger receivers for backward compatibility
        - zipkin      # Zipkin compatibility
      processors:
        - batch       # Batch traces for efficiency
        - memory_limiter
      exporters:
        - jaeger_storage_exporter

  telemetry:
    logs:
      level: debug  # Verbose logging for development
    metrics:
      level: detailed

extensions:
  # Health check extension v2 for container health monitoring
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "0.0.0.0:13133"

  # Jaeger storage configuration
  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 100000  # Development limit

  # Jaeger query service configuration
  jaeger_query:
    storage:
      traces: memory_store
    base_path: /
    ui:
      config_file: ""

receivers:
  # OpenTelemetry Protocol receivers (v2 native)
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:8000"

  # Legacy Jaeger receivers for backward compatibility
  jaeger:
    protocols:
      grpc:
        endpoint: "0.0.0.0:14250"
      thrift_http:
        endpoint: "0.0.0.0:14268"
      thrift_compact:
        endpoint: "0.0.0.0:6831"
      thrift_binary:
        endpoint: "0.0.0.0:6832"

  # Zipkin receiver for compatibility
  zipkin:
    endpoint: "0.0.0.0:9411"

processors:
  # Batch processor for efficient trace processing
  batch:
    timeout: 1s
    send_batch_size: 100

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Jaeger storage exporter
  jaeger_storage_exporter:
    trace_storage: memory_store
