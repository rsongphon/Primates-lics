# Kong Declarative Configuration - Production Environment
# LICS API Gateway Configuration - Production
# Documentation: https://docs.konghq.com/gateway/latest/production/deployment-topologies/db-less-and-declarative-config/

_format_version: "3.0"
_transform: true

# ===== SERVICES =====

services:
  # LICS Backend Service - Production
  - name: lics-backend
    url: http://lics-backend:8000
    protocol: http
    retries: 5              # More retries in production
    connect_timeout: 30000  # Shorter timeout in production
    write_timeout: 30000
    read_timeout: 30000
    tags:
      - lics
      - backend
      - production

    routes:
      - name: api-v1
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        protocols:
          - https        # HTTPS only in production
        tags:
          - api
          - v1

    plugins:
      # Stricter Rate Limiting for Production
      - name: rate-limiting
        enabled: true
        config:
          minute: 100
          hour: 1000
          day: 10000
          policy: redis
          fault_tolerant: true
          hide_client_headers: false
          redis:
            host: redis-prod
            port: 6379
            database: 0
            timeout: 2000
            password: ${REDIS_PASSWORD}  # Use environment variable
        tags:
          - rate-limiting
          - production

      # JWT Authentication
      - name: jwt
        enabled: true
        config:
          secret_is_base64: false
          run_on_preflight: false
          uri_param_names:
            - jwt
          claims_to_verify:
            - exp
            - nbf  # Not before claim
          maximum_expiration: 3600  # 1 hour max in production
        tags:
          - authentication

      # CORS - Strict origins in production
      - name: cors
        enabled: true
        config:
          origins:
            - https://app.lics.example.com
            - https://www.lics.example.com
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Content-Type
            - Authorization
            - X-Correlation-ID
          exposed_headers:
            - X-Correlation-ID
            - X-RateLimit-Limit
            - X-RateLimit-Remaining
          credentials: true
          max_age: 3600
        tags:
          - cors
          - security

      # Request Transformer
      - name: request-transformer
        enabled: true
        config:
          add:
            headers:
              - X-Gateway: Kong
              - X-Environment: production
          remove:
            headers:
              - X-Debug  # Remove debug headers in production
        tags:
          - transformation

      # Response Transformer
      - name: response-transformer
        enabled: true
        config:
          add:
            headers:
              - X-Gateway: Kong
              - Strict-Transport-Security: max-age=31536000; includeSubDomains
              - X-Content-Type-Options: nosniff
              - X-Frame-Options: DENY
              - X-XSS-Protection: 1; mode=block
          remove:
            headers:
              - X-Powered-By
              - Server
        tags:
          - transformation
          - security

      # Prometheus Metrics
      - name: prometheus
        enabled: true
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
        tags:
          - monitoring

      # Request Size Limiting
      - name: request-size-limiting
        enabled: true
        config:
          allowed_payload_size: 10  # Stricter 10MB limit in production
          size_unit: megabytes
        tags:
          - security

      # IP Restriction (configure based on needs)
      - name: ip-restriction
        enabled: false
        config:
          allow:
            - 10.0.0.0/8      # Internal network
            - 172.16.0.0/12   # Internal network
            - 192.168.0.0/16  # Internal network
          deny: []
        tags:
          - security

      # Bot Detection Plugin
      - name: bot-detection
        enabled: true
        config:
          allow: []
          deny:
            - ".*bot.*"
            - ".*crawler.*"
            - ".*spider.*"
        tags:
          - security

  # LICS WebSocket Service - Production
  - name: lics-websocket
    url: http://lics-backend:8001
    protocol: http
    retries: 3
    connect_timeout: 60000
    write_timeout: 120000
    read_timeout: 120000
    tags:
      - lics
      - websocket
      - production

    routes:
      - name: websocket
        paths:
          - /ws
        strip_path: false
        preserve_host: true
        protocols:
          - https
          - wss  # Secure WebSocket only
        tags:
          - websocket

    plugins:
      # Rate Limiting for WebSocket
      - name: rate-limiting
        enabled: true
        config:
          minute: 200
          hour: 2000
          policy: redis
          redis:
            host: redis-prod
            port: 6379
            database: 0
            password: ${REDIS_PASSWORD}
        tags:
          - rate-limiting

      # JWT Authentication
      - name: jwt
        enabled: true
        config:
          secret_is_base64: false
          claims_to_verify:
            - exp
        tags:
          - authentication

      # CORS
      - name: cors
        enabled: true
        config:
          origins:
            - https://app.lics.example.com
          credentials: true
        tags:
          - cors

# ===== CONSUMERS =====

consumers: []  # Managed separately in production

# ===== GLOBAL PLUGINS =====

plugins:
  # Global Correlation ID
  - name: correlation-id
    enabled: true
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
    tags:
      - global

  # Global Request ID
  - name: request-id
    enabled: true
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
    tags:
      - global

  # Request Termination for Maintenance Mode
  - name: request-termination
    enabled: false  # Enable during maintenance
    config:
      status_code: 503
      message: System under maintenance
    tags:
      - maintenance

  # Datadog APM (if using Datadog)
  - name: datadog
    enabled: false
    config:
      host: datadog-agent
      port: 8126
      service_name: lics-gateway
    tags:
      - monitoring
      - apm

# ===== UPSTREAMS =====

upstreams:
  - name: lics-backend-upstream
    algorithm: consistent-hashing  # Better for production
    hash_on: ip
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        type: https  # HTTPS health checks in production
        https_verify_certificate: true
        http_path: /health
        timeout: 5
        concurrency: 10
        healthy:
          interval: 10
          successes: 2
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 10
          http_failures: 3
          timeouts: 3
          tcp_failures: 3
          http_statuses:
            - 429
            - 500
            - 503
      passive:
        type: https
        healthy:
          http_statuses:
            - 200
            - 201
            - 202
            - 203
            - 204
            - 205
            - 206
            - 207
            - 208
            - 226
            - 300
            - 301
            - 302
            - 303
            - 304
            - 305
            - 306
            - 307
            - 308
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 2
          timeouts: 3
          http_statuses:
            - 429
            - 500
            - 503
    tags:
      - upstream
      - production

    targets:
      # Multiple targets for load balancing in production
      - target: lics-backend-1:8000
        weight: 100
        tags:
          - primary
      - target: lics-backend-2:8000
        weight: 100
        tags:
          - primary
      - target: lics-backend-3:8000
        weight: 100
        tags:
          - primary

# ===== CERTIFICATES =====

certificates:
  # Production SSL Certificate
  - cert: |
      -----BEGIN CERTIFICATE-----
      # Production certificate content
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      # Production private key content
      -----END PRIVATE KEY-----
    tags:
      - production
      - ssl

# ===== CA CERTIFICATES =====

ca_certificates: []
