# PgBouncer Configuration for LICS Phase 2 Database Optimization

[databases]
# Primary database connection
lics_dev = host = postgres-dev port = 5432 user=lics password=lics123 dbname=lics_dev
# Fallback connection for testing
* = host = postgres-dev port = 5432 user=lics password=lics123 dbname=lics_dev

[pgbouncer]
# Network settings
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = any
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, lics

# Connection Pooling (Optimized for Phase 2)
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100

# Query Timeouts (Optimized for TimescaleDB)
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600

# Client Timeouts
query_timeout = 30000
query_wait_timeout = 120
client_idle_timeout = 3600
client_login_timeout = 60

# Connection Sanity Checks
connect_timeout = 10
autodb_idle_timeout = 3600
autodb_pool_mode = transaction
autodb_max_db_connections = 100
autodb_pool_size = 5

# Log Settings (Enhanced for Phase 2 monitoring)
syslog = 0
syslog_facility = daemon
syslog_ident = pgbouncer
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60
verbose = 1

# Application Settings
ignore_startup_parameters = extra_float_digits,search_path,application_name
track_extra_parameters = search_path

# TimescaleDB Optimizations
# Enable prepared statement pooling
application_name_add_host = 1

# Performance Monitoring
show_prometheus_stats = 1